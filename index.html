<!-- Purpose: Provide the browser document shell in which the React application mounts. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <script>try{var t=localStorage.getItem('clicktots-site-theme');document.documentElement.dataset.siteTheme=t==='dark'?'dark':'light';}catch(e){document.documentElement.dataset.siteTheme='light';}</script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Clicktots Technologies · AI-Powered Digital Marketing Agency in Chennai</title>
    <meta name="description" content="Clicktots is an AI-powered digital marketing agency in Chennai: conversion websites, predictive SEO &amp; AEO, generative design, branding and performance marketing engineered as one growth system." />
    <meta property="og:title" content="Clicktots Technologies · AI-Powered Digital Marketing Agency in Chennai" />
    <meta property="og:description" content="Clicktots is an AI-powered digital marketing agency in Chennai: conversion websites, predictive SEO &amp; AEO, generative design, branding and performance marketing engineered as one growth system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Michroma, self-hosted (one 20 KB file, no render-blocking Google Fonts request) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/michroma-latin-400.woff2" crossorigin />
    <link rel="preload" as="image" href="/layers/d/hero-poster.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/layers/m/hero-poster.webp" media="(max-width: 767px)" fetchpriority="high" />
    <style>
      @font-face {
        font-family: "Michroma";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/michroma-latin-400.woff2") format("woff2");
      }
      html, body { margin: 0; padding: 0; background: #05070c; color: #fff; font-family: "Michroma", system-ui, -apple-system, sans-serif; }
      .ct-ssr-hero { position: relative; height: 100svh; width: 100%; overflow: hidden; background: #05070c; }
      .ct-ssr-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
      .ct-ssr-veil {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 0 20px; text-align: center; pointer-events: none;
      }
      .ct-ssr-eyebrow {
        position: relative; z-index: 2; margin: 0; font-family: "Michroma", system-ui, sans-serif; font-size: clamp(0.6rem, 1.05vw, 0.85rem);
        letter-spacing: 0.16em; text-transform: uppercase; color: rgba(215, 224, 240, 0.78);
        text-shadow: 0 1px 10px rgba(0, 6, 18, 0.8);
      }
      .ct-ssr-prompt {
        position: relative; z-index: 2; margin: 12px 0 0; font-family: "Michroma", system-ui, sans-serif; font-size: clamp(0.72rem, 1.32vw, 1.1rem);
        letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 2px 18px rgba(0, 6, 18, 0.85);
      }
      @media (min-width: 768px) { .ct-ssr-prompt { letter-spacing: 0.34em; } }
      .ct-ssr-arrow { position: relative; z-index: 2; margin: 22px 0 0; font-size: 0.95rem; color: rgba(215, 224, 240, 0.78); }
      .ct-ssr-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: 16px 16px 0; pointer-events: none;
      }
      .ct-ssr-nav-in { max-width: 80rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
      .ct-ssr-logo { height: 32px; width: auto; object-fit: contain; display: block; }
      .ct-ssr-menu {
        width: 40px; height: 40px; border-radius: 9999px; border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(12, 17, 27, 0.85); display: flex; align-items: center; justify-content: center;
      }
      @media (min-width: 640px) {
        .ct-ssr-nav { padding: 24px 32px 0; }
        .ct-ssr-logo { height: 40px; }
      }
      @media (min-width: 1024px) { .ct-ssr-menu { display: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ct-ssr-hero">
        <div class="ct-ssr-nav">
          <div class="ct-ssr-nav-in">
            <img src="/assets/clicktots-logo-dark.webp" alt="Clicktots Technologies" width="120" height="40" class="ct-ssr-logo" />
            <div class="ct-ssr-menu" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
            </div>
          </div>
        </div>
        <picture>
          <source media="(max-width: 767px)" srcset="/layers/m/hero-poster.webp" />
          <img src="/layers/d/hero-poster.webp" alt="" width="1280" height="724" class="ct-ssr-img" decoding="sync" fetchpriority="high" />
        </picture>
        <div class="ct-ssr-veil">
          <p class="ct-ssr-eyebrow">AI-POWERED DIGITAL MARKETING AGENCY &middot; CHENNAI</p>
          <p class="ct-ssr-prompt">SCROLL TO CLEAR THE MARKET NOISE</p>
          <span class="ct-ssr-arrow" aria-hidden="true">&darr;</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
