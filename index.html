<html lang="en">

    <script>try{var t=localStorage.getItem('clicktots-site-theme');document.documentElement.dataset.siteTheme=t==='dark'?'dark':'light';}catch(e){document.documentElement.dataset.siteTheme='light';}</script>

    <!-- Michroma, self-hosted (one 20 KB file, no render-blocking Google Fonts request) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/michroma-latin-400.woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Michroma";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/michroma-latin-400.woff2") format("woff2");
      }
      html, body { margin: 0; padding: 0; background: #05070c; color: #fff; font-family: "Michroma", system-ui, -apple-system, sans-serif; }
      .ct-ssr-hero { position: relative; height: 100svh; width: 100%; overflow: hidden; background: #05070c; }
      .ct-ssr-layer { position: absolute; inset: 0; }
      .ct-ssr-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 58% 50%; display: block; }
      @media (min-width: 768px) { .ct-ssr-img { object-position: center; } }
      .ct-ssr-veil {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 0 20px; text-align: center; pointer-events: none;
        background:
          radial-gradient(ellipse 68% 54% at 28% 36%, rgba(162, 182, 218, 0.34) 0%, rgba(78, 96, 132, 0.24) 42%, transparent 74%),
          radial-gradient(ellipse 52% 44% at 62% 44%, rgba(112, 134, 174, 0.20) 0%, rgba(36, 48, 74, 0.18) 48%, transparent 78%),
          radial-gradient(ellipse 80% 60% at 20% 52%, rgba(128, 148, 184, 0.22) 0%, transparent 65%),
          linear-gradient(180deg, rgba(4, 7, 13, 0.42) 0%, rgba(18, 26, 42, 0.32) 48%, rgba(4, 7, 13, 0.56) 100%);
      }
      .ct-ssr-dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .ct-ssr-eyebrow {
        position: relative; z-index: 2; margin: 0; font-family: "Michroma", system-ui, sans-serif; font-size: clamp(0.6rem, 1.05vw, 0.85rem);
        letter-spacing: 0.16em; text-transform: uppercase; color: rgba(215, 224, 240, 0.74);
        text-shadow: 0 1px 10px rgba(0, 6, 18, 0.8);
      }
      .ct-ssr-prompt {
        position: relative; z-index: 2; margin: 12px 0 0; font-family: "Michroma", system-ui, sans-serif; font-size: clamp(0.72rem, 1.32vw, 1.1rem);
        letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255, 255, 255, 0.94);
        text-shadow: 0 2px 18px rgba(0, 6, 18, 0.85);
      }
      @media (min-width: 768px) { .ct-ssr-prompt { letter-spacing: 0.34em; } }
      .ct-ssr-arrow { position: relative; z-index: 2; margin: 22px 0 0; font-size: 0.95rem; color: rgba(215, 224, 240, 0.72); }
      .ct-ssr-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: 16px 16px 0; pointer-events: none;
      }
      .ct-ssr-nav-in { max-width: 80rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
      .ct-ssr-logo { height: 32px; width: auto; object-fit: contain; display: block; }
      .ct-ssr-menu {
        width: 40px; height: 40px; border-radius: 9999px; border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(12, 17, 27, 0.85); display: flex; align-items: center; justify-content: center;
      }
      @media (min-width: 640px) {
        .ct-ssr-nav { padding: 24px 32px 0; }
        .ct-ssr-logo { height: 40px; }
      }
      @media (min-width: 1024px) { .ct-ssr-menu { display: none; } }
    </style>
    <link rel="preload" as="image" href="/layers/d/moonscape.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/layers/d/sky.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/layers/m/moonscape.webp" media="(max-width: 767px)" fetchpriority="high" />

    <link rel="preload" as="image" href="/layers/m/earth.webp" media="(max-width: 767px)" fetchpriority="high" />
  </head>

      </div>
    </div>

</html>
